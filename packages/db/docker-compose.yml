name: multi-tenant-ai-catalog

services:
  mongodb:
    image: mongo:8
    container_name: multi-tenant-ai-catalog-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: multi-tenant-ai-catalog
    ports:
      - "27017:27017"
    volumes:
      - multi-tenant-ai-catalog_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  multi-tenant-ai-catalog_mongodb_data:
